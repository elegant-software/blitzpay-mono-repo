name: Contract Tests

on:
  workflow_dispatch:
    inputs:
      stubs_version:
        description: "blitz-pay stubs JAR version to test against"
        required: true
        type: string
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to latest configured branches
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote blitz-pay-prototype blitzpay-admin-dashboard

      - name: Debug updated submodules
        run: |
          echo "=== admin dashboard commit ==="
          git -C blitzpay-admin-dashboard rev-parse HEAD
          echo "=== admin dashboard tsconfig.contract.json ==="
          cat blitzpay-admin-dashboard/tsconfig.contract.json
          echo "=== admin dashboard angular contract config ==="
          rg -n "contract-test|tsconfig.contract.json|contract\\.spec|contract-spec" blitzpay-admin-dashboard/angular.json
          echo "=== mobile repo commit ==="
          git -C blitz-pay-prototype rev-parse HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure GitHub Packages auth
        env:
          PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME || github.actor }}
          PACKAGES_TOKEN: ${{ secrets.MONO_REPO_DISPATCH_TOKEN }}
        run: |
          cat > "$HOME/.netrc" <<EOF
          machine maven.pkg.github.com
            login ${PACKAGES_USERNAME}
            password ${PACKAGES_TOKEN}
          EOF
          chmod 600 "$HOME/.netrc"

      - name: Install Bazelisk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 \
            -o "$HOME/.local/bin/bazel"
          chmod +x "$HOME/.local/bin/bazel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set stubs version in MODULE.bazel
        if: ${{ inputs.stubs_version != '' }}
        run: |
          sed -i "s|com.elegant.software.blitzpay:blitz-pay:jar:stubs:[^\"]*|com.elegant.software.blitzpay:blitz-pay:jar:stubs:${{ inputs.stubs_version }}|g" MODULE.bazel
          sed -i "s|com.elegant.software.blitzpay:blitz-pay:jar:stubs:[^\"]*|com.elegant.software.blitzpay:blitz-pay:jar:stubs:${{ inputs.stubs_version }}|g" contract-tests/*/BUILD.bazel

      - name: Install Node (for consumer npm test:contract scripts)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install consumer dependencies
        run: |
          npm ci --prefix blitzpay-admin-dashboard
          npm ci --prefix blitz-pay-prototype/blitz-pay
          npm ci --prefix blitz-pay-prototype/blitz-pay-merchant

      - name: Run contract tests
        run: bazel test --config=ci //:contract_tests
